name: Android Dev Debug Pipeline

# Trigger the workflow on push or pull request to dev branch
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 4️⃣ Run unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 5️⃣ Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6️⃣ Upload APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Notify Teams
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          BRANCH_NAME: dev
          STATUS: ${{ job.status }}
          run: |
            curl -H "Content-Type: application/json" \
                 -d '{"text": "🚀 New APK build is ready for dev branch!"}' \
                 $WEBHOOK_URL